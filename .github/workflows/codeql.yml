name: "CodeQL"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "21 20 * * 3"

jobs:
  analyze:
    name: Analyze
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: Mellanox/cloud-orchestration-reusable-workflows/.github/workflows/codeql-reusable.yml@main
